                    {sel&&<div style={{width:6,height:6,borderRadius:"50%",background:"#fff"}}/>}
                  </div>
                  <div>
                    <div style={{fontSize:13.5,fontWeight:600,color:sel?COLOR:"#333"}}>{e.fechaEntrega}</div>
                    {e.fechaLimite&&<div style={{fontSize:11.5,color:"#888",marginTop:1}}>Prazo límite: {e.fechaLimite}</div>}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      );
    };

    const Stat=({n,label,color})=>(
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:28,fontWeight:700,color:color||"#222"}}>{n}</div>
        <div style={{fontSize:12,color:"#888",marginTop:2}}>{label}</div>
      </div>
    );

    function ProductCard({prod,qty,setCant,opcionesLote,setOpcionesLote}){
      const C=COLOR,kg=prod.bandeja?+(qty*prod.bandeja).toFixed(2):null,sub=+(qty*prod.pBandeja).toFixed(2),esLote=!!prod.opciones;
      return(
        <div style={{background:"#fff",border:qty>0?`1.5px solid ${C}`:"1px solid #eee",borderRadius:12,padding:"11px 14px",marginBottom:8}}>
          <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
            <div style={{flex:1}}>
              <div style={{fontSize:13.5,color:"#222",fontWeight:500}}>{prod.nombre}</div>
              <div style={{fontSize:11,color:"#888",marginTop:2}}>
                {prod.bandeja?<span>≈ {prod.bandeja} kg · </span>:null}
                <span>{eur(prod.pBandeja)}/{esLote?"lote":"bandeja"}</span>
                <span style={{margin:"0 6px",color:"#ddd"}}>|</span>
                <span>{eur(prod.pKilo)}/kg</span>
                {prod.nota?<span> · {prod.nota}</span>:null}
              </div>
              {qty>0&&<div style={{fontSize:11,marginTop:3}}>{!esLote&&kg?<span style={{color:"#888"}}>≈ {kg} kg · </span>:null}<span style={{color:C,fontWeight:700}}>{eur(sub)}</span></div>}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
              <button onClick={()=>setCant(prod.id,qty-1)} style={{width:28,height:28,borderRadius:8,border:`1.5px solid ${C}`,background:"#fff",color:C,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}}>−</button>
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:14,fontWeight:600,minWidth:22,textAlign:"center",color:"#222"}}>{qty}</div>
                <div style={{fontSize:10,color:"#aaa",lineHeight:1}}>{esLote?"lote(s)":`bandeja${qty!==1?"s":""}`}</div>
              </div>
              <button onClick={()=>setCant(prod.id,qty+1)} style={{width:28,height:28,borderRadius:8,border:`1.5px solid ${C}`,background:"#fff",color:C,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}}>+</button>
            </div>
          </div>
          {esLote&&qty>0&&(
            <div style={{marginTop:10,paddingTop:8,borderTop:"1px solid #f2f2f2"}}>
              {prod.opciones.map((op,oi)=>(
                <div key={oi} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                  <span style={{fontSize:12,color:"#555",flexShrink:0}}>{op.label}</span>
                  <select value={(opcionesLote[prod.id]||{})[oi]||""} onChange={e=>setOpcionesLote(prev=>({...prev,[prod.id]:{...(prev[prod.id]||{}),[oi]:e.target.value}}))} style={{fontSize:12,padding:"4px 10px",borderRadius:8,border:`1.5px solid ${C}`,color:"#333",background:"#fff",flex:1}}>
                    <option value="">-- elige --</option>
                    {op.choices.map(ch=><option key={ch} value={ch}>{ch}</option>)}
                  </select>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function PanelFechas({entregas,setEntregas}){
      const [lista,setLista]=useState(entregas||[]);
      const [guardando,setGuardando]=useState(false);

      const addEntrega=()=>setLista(prev=>[...prev,{fechaEntrega:"",fechaLimite:"",fechaLimiteISO:""}]);
      const removeEntrega=(i)=>setLista(prev=>prev.filter((_,idx)=>idx!==i));
      const updateEntrega=(i,campo,val)=>setLista(prev=>prev.map((e,idx)=>idx===i?{...e,[campo]:val}:e));

      const guardar=async()=>{
        const validas=lista.filter(e=>e.fechaEntrega.trim());
        setGuardando(true);
        await window.db.from("config").upsert([{clave:"entregas_multiples",valor:JSON.stringify(validas)}],{onConflict:"clave"});
        setEntregas(validas);
        setGuardando(false);
        alert("Entregas gardadas correctamente ✅");
      };

      const ahora=new Date();
      return(
        <div style={{background:"#fff",border:"1px solid #eee",borderRadius:14,padding:"20px"}}>
          <div style={{fontSize:15,fontWeight:700,color:COLOR,marginBottom:4}}>📅 Xestión de entregas</div>
          <div style={{fontSize:12.5,color:"#888",marginBottom:18,lineHeight:1.5}}>Engade todas as datas de entrega dispoñibles. Os clientes poderán escoller a que máis lles conveña. As entregas con prazo vencido ocúltanse automaticamente.</div>

          {lista.map((e,i)=>{
            const vencida=e.fechaLimiteISO&&new Date(e.fechaLimiteISO+"T23:59:59")<ahora;
            return(
              <div key={i} style={{background:vencida?"#fafafa":"#f8fffe",border:`1.5px solid ${vencida?"#eee":COLOR}`,borderRadius:12,padding:"14px",marginBottom:12,opacity:vencida?0.6:1}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div style={{fontSize:13,fontWeight:700,color:vencida?"#aaa":COLOR}}>Entrega #{i+1} {vencida&&<span style={{fontSize:11,fontWeight:400,color:"#c0392b"}}>(prazo vencido)</span>}</div>
                  <button onClick={()=>removeEntrega(i)} style={{background:"none",border:"none",color:"#ccc",fontSize:18,cursor:"pointer",lineHeight:1}}>×</button>
                </div>
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:12,color:"#555",marginBottom:4,fontWeight:600}}>Data de entrega <span style={{color:"#c0392b"}}>*</span></div>
                  <input type="text" value={e.fechaEntrega} onChange={ev=>updateEntrega(i,"fechaEntrega",ev.target.value)} placeholder="Ex: venres 27 de xuño" style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1.5px solid #ddd",fontSize:13,outline:"none",boxSizing:"border-box"}}/>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  <div>
                    <div style={{fontSize:12,color:"#555",marginBottom:4,fontWeight:600}}>Prazo límite (texto)</div>
                    <input type="text" value={e.fechaLimite} onChange={ev=>updateEntrega(i,"fechaLimite",ev.target.value)} placeholder="Ex: mércores 25 ás 20:00h" style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1.5px solid #ddd",fontSize:13,outline:"none",boxSizing:"border-box"}}/>
                  </div>
                  <div>
                    <div style={{fontSize:12,color:"#555",marginBottom:4,fontWeight:600}}>Prazo límite (data ISO)</div>
                    <input type="date" value={e.fechaLimiteISO} onChange={ev=>updateEntrega(i,"fechaLimiteISO",ev.target.value)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1.5px solid #ddd",fontSize:13,outline:"none",boxSizing:"border-box",color:"#333"}}/>
                    <div style={{fontSize:10.5,color:"#aaa",marginTop:3}}>Para ocultar automáticamente</div>
                  </div>
                </div>
              </div>
            );
          })}

          <button onClick={addEntrega} style={{width:"100%",background:"#f0faf5",color:COLOR,border:`1.5px dashed ${COLOR}`,borderRadius:10,padding:"11px",fontSize:14,fontWeight:600,cursor:"pointer",marginBottom:16}}>+ Engadir entrega</button>

          {lista.length>0&&(
            <div style={{background:"#E8F4FD",border:"1px solid #AED6F1",borderRadius:10,padding:"12px 14px",marginBottom:16}}>
              <div style={{fontSize:12,fontWeight:700,color:"#1a5276",marginBottom:8}}>Vista previa do banner:</div>
              <BannerFechas entregas={lista}/>
            </div>
          )}

          <button onClick={guardar} disabled={guardando} style={{width:"100%",background:COLOR,color:"#fff",border:"none",borderRadius:12,padding:"13px",fontSize:15,fontWeight:700,cursor:"pointer",opacity:guardando?0.7:1}}>
            {guardando?"Gardando...":"Gardar todas as entregas"}
          </button>
        </div>
      );
    }

    function Panel({cats,setCats,entregas,setEntregas,onBack}){
      const [tabP,setTabP]=useState("totales");
      const [filtroEstado,setFiltroEstado]=useState("todos");
      const [filtroDia,setFiltroDia]=useState(todayISO);
      const [filtroEntrega,setFiltroEntrega]=useState("");
      const [pedidos,setPedidos]=useState([]);
      const [cargando,setCargando]=useState(true);
      const [editando,setEditando]=useState(null);
      const [formProd,setFormProd]=useState({nombre:"",bandeja:"",pBandeja:"",pKilo:"",nota:""});

      useEffect(()=>{cargarPedidos();},[]);

      const cargarPedidos=async()=>{
        setCargando(true);
        const{data,error}=await window.db.from("pedidos").select("*").order("id",{ascending:false});
        if(!error) setPedidos(data||[]);
        setCargando(false);
      };

      const CAMPOS=[
        {key:"nombre",label:"Nombre *",type:"text"},
        {key:"bandeja",label:"Peso bandeja (kg)",type:"number"},
        {key:"pBandeja",label:"Precio bandeja (€) *",type:"number"},
        {key:"pKilo",label:"Precio kilo (€) *",type:"number"},
        {key:"nota",label:"Nota (opcional)",type:"text"},
      ];

      const abrirEditar=(catId,prod)=>{setFormProd({nombre:prod.nombre,bandeja:prod.bandeja||"",pBandeja:prod.pBandeja,pKilo:prod.pKilo,nota:prod.nota||""});setEditando({catId,prodId:prod.id,nuevo:false});};
      const abrirNuevo=(catId)=>{setFormProd({nombre:"",bandeja:"",pBandeja:"",pKilo:"",nota:""});setEditando({catId,nuevo:true});};

      const guardar=()=>{
        const nombre=(formProd.nombre||"").trim();
        const pBandeja=parseFloat(String(formProd.pBandeja).replace(",","."));
        const pKilo=parseFloat(String(formProd.pKilo).replace(",","."));
        const bandeja=formProd.bandeja?parseFloat(String(formProd.bandeja).replace(",",".")):null;
        if(!nombre||isNaN(pBandeja)||isNaN(pKilo)){alert("Rellena: Nombre, Precio bandeja y Precio kilo.");return;}
        const nc=cats.map(cat=>{
          if(cat.id!==editando.catId) return cat;
          if(editando.nuevo) return{...cat,productos:[...cat.productos,{id:"custom_"+Date.now(),nombre,bandeja,pBandeja,pKilo,nota:formProd.nota||undefined}]};
          return{...cat,productos:cat.productos.map(p=>p.id===editando.prodId?{...p,nombre,bandeja,pBandeja,pKilo,nota:formProd.nota||undefined}:p)};
        });
        setCats(nc);setEditando(null);
      };

      const toggleCategoria=(catId)=>{setCats(cats.map(c=>c.id===catId?{...c,activa:!c.activa}:c));};
      const eliminarProd=(catId,prodId)=>{if(!window.confirm("¿Eliminar este producto?"))return;setCats(cats.map(c=>c.id!==catId?c:{...c,productos:c.productos.filter(p=>p.id!==prodId)}));};

      const cambiarEstado=async(id,estado)=>{
        await window.db.from("pedidos").update({estado}).eq("id",id);
        setPedidos(prev=>prev.map(p=>p.id===id?{...p,estado}:p));
        if(estado==="listo"){const pedido=pedidos.find(p=>p.id===id);sendEmailListo(pedido);}
      };

      const eliminarPedido=async(id)=>{if(!window.confirm("¿Eliminar este pedido?"))return;await window.db.from("pedidos").delete().eq("id",id);setPedidos(prev=>prev.filter(p=>p.id!==id));};
      const eliminarGestionados=async()=>{if(!window.confirm("¿Eliminar todos los gestionados?"))return;await window.db.from("pedidos").delete().eq("estado","listo");setPedidos(prev=>prev.filter(p=>p.estado!=="listo"));};

      const entregasEnPedidos=useMemo(()=>{
        const set=new Set(pedidos.filter(p=>p.entrega_elegida).map(p=>p.entrega_elegida));
        return Array.from(set).sort();
      },[pedidos]);

      const filtrados=useMemo(()=>pedidos.filter(p=>{
        const eOk=filtroEstado==="todos"||p.estado===filtroEstado;
        const dOk=!filtroDia||p.iso_date===filtroDia;
        const enOk=!filtroEntrega||p.entrega_elegida===filtroEntrega;
        return eOk&&dOk&&enOk;
      }),[pedidos,filtroEstado,filtroDia,filtroEntrega]);

      const totalesProd=useMemo(()=>{
        const map={};
        filtrados.forEach(p=>(p.productos||[]).forEach(pr=>{
          if(!map[pr.nombre]) map[pr.nombre]={nombre:pr.nombre,bandejas:0,kg:0,importe:0};
          map[pr.nombre].bandejas+=pr.bandejas;map[pr.nombre].kg+=pr.kgTotal||0;map[pr.nombre].importe+=pr.subtotal||0;
        }));
        return Object.values(map).sort((a,b)=>b.bandejas-a.bandejas);
      },[filtrados]);

      const exportCSV=()=>{
        const rows=[["Cliente","Teléfono","Email","Fecha","Entrega","Estado","Producto","Opciones","Uds","Kg","Subtotal","Nota"]];
        filtrados.forEach(p=>(p.productos||[]).forEach(pr=>rows.push([p.nombre,p.telefono,p.email||"",p.fecha,p.entrega_elegida||"",p.estado,pr.nombre,pr.opcion||"",pr.bandejas,(pr.kgTotal||"").toString(),pr.subtotal?eur(pr.subtotal):"",p.nota||""])));
        const csv=rows.map(r=>r.map(c=>`"${c}"`).join(",")).join("\n");
        const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="pedidos_carnes.csv";a.click();
      };

      const total=pedidos.length,pendientes=pedidos.filter(p=>p.estado==="pendiente").length,confirmados=pedidos.filter(p=>p.estado==="preparando").length,gestionados=pedidos.filter(p=>p.estado==="listo").length;
      const tabBtn=(id,lbl)=>(<button onClick={()=>setTabP(id)} style={{padding:"7px 16px",borderRadius:20,border:`1.5px solid ${tabP===id?COLOR:"#ddd"}`,background:tabP===id?COLOR:"#fff",color:tabP===id?"#fff":"#555",fontSize:13,cursor:"pointer",fontWeight:tabP===id?600:400,flexShrink:0}}>{lbl}</button>);

      return(
        <div style={{fontFamily:"system-ui,sans-serif",maxWidth:780,margin:"0 auto",paddingBottom:40}}>
          <div style={{background:COLOR,padding:"20px",borderRadius:"0 0 16px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div>
              <div style={{color:"#fff",fontSize:20,fontWeight:700}}>📋 Panel de la tienda</div>
              <div style={{color:"rgba(255,255,255,0.82)",fontSize:13,marginTop:3}}>Carnes Ecológicas Mundo Verde</div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={cargarPedidos} style={{background:"rgba(255,255,255,0.18)",border:"none",color:"#fff",borderRadius:20,padding:"7px 14px",cursor:"pointer",fontSize:13}}>🔄</button>
              <button onClick={exportCSV} style={{background:"rgba(255,255,255,0.18)",border:"none",color:"#fff",borderRadius:20,padding:"7px 14px",cursor:"pointer",fontSize:13}}>⬇ CSV</button>
              <button onClick={onBack} style={{background:"rgba(255,255,255,0.18)",border:"none",color:"#fff",borderRadius:20,padding:"7px 14px",cursor:"pointer",fontSize:13}}>← Tienda</button>
            </div>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,padding:"24px 20px 8px"}}>
            <Stat n={total} label="Total"/><Stat n={pendientes} label="Pendientes" color="#E74C3C"/><Stat n={confirmados} label="Confirmados" color={COLOR}/><Stat n={gestionados} label="Gestionados" color="#3498DB"/>
          </div>

          <div style={{display:"flex",gap:8,padding:"16px 20px 8px",overflowX:"auto"}}>
            {tabBtn("totales","📊 Totales")}{tabBtn("pedidos","📦 Pedidos")}{tabBtn("productos","🛍 Produtos")}{tabBtn("gestionar","⚙️ Xestionar")}{tabBtn("fechas","📅 Entregas")}
          </div>

          {tabP!=="gestionar"&&tabP!=="fechas"&&(
            <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 20px",flexWrap:"wrap"}}>
              <select value={filtroEstado} onChange={e=>setFiltroEstado(e.target.value)} style={{padding:"7px 12px",borderRadius:10,border:"1.5px solid #ddd",fontSize:13,background:"#fff",color:"#333"}}>
                {["todos","pendiente","preparando","listo"].map(e=><option key={e} value={e}>{{todos:"Todos los estados",pendiente:"Pendiente",preparando:"Preparando",listo:"Listo"}[e]}</option>)}
              </select>
              <input type="date" value={filtroDia} onChange={e=>setFiltroDia(e.target.value)} style={{padding:"7px 12px",borderRadius:10,border:"1.5px solid #ddd",fontSize:13,background:"#fff",color:"#333"}}/>
              {filtroDia&&<button onClick={()=>setFiltroDia("")} style={{fontSize:12,color:"#aaa",background:"none",border:"none",cursor:"pointer"}}>✕ Fecha</button>}
              {entregasEnPedidos.length>0&&(
                <select value={filtroEntrega} onChange={e=>setFiltroEntrega(e.target.value)} style={{padding:"7px 12px",borderRadius:10,border:"1.5px solid #ddd",fontSize:13,background:"#fff",color:"#333",maxWidth:180}}>
                  <option value="">Todas las entregas</option>
                  {entregasEnPedidos.map(e=><option key={e} value={e}>{e}</option>)}
                </select>
              )}
              {filtroEntrega&&<button onClick={()=>setFiltroEntrega("")} style={{fontSize:12,color:"#aaa",background:"none",border:"none",cursor:"pointer"}}>✕ Entrega</button>}
              <span style={{marginLeft:"auto",fontSize:13,color:"#aaa"}}>{filtrados.length} pedido{filtrados.length!==1?"s":""}</span>
              {pedidos.filter(p=>p.estado==="listo").length>0&&(
                <button onClick={eliminarGestionados} style={{fontSize:12,color:"#c0392b",background:"none",border:"1px solid #e8b5b2",borderRadius:8,padding:"4px 10px",cursor:"pointer"}}>🗑 Borrar gestionados</button>
              )}
            </div>
          )}

          <div style={{padding:"8px 20px"}}>
            {cargando&&<div style={{textAlign:"center",padding:40,color:"#aaa",fontSize:14}}>Cargando...</div>}
            {!cargando&&tabP!=="gestionar"&&tabP!=="fechas"&&filtrados.length===0&&<div style={{textAlign:"center",padding:40,color:"#bbb",fontSize:14}}>No hay datos</div>}

            {!cargando&&(tabP==="totales"||tabP==="productos")&&filtrados.length>0&&(
              <div style={{background:"#fff",border:"1px solid #eee",borderRadius:14,overflow:"hidden"}}>
                {filtroEntrega&&<div style={{padding:"8px 16px",background:COLOR_LIGHT,fontSize:12,color:COLOR,fontWeight:600}}>📦 Filtrando por entrega: {filtroEntrega}</div>}
                <div style={{display:"grid",gridTemplateColumns:"1fr auto auto auto",gap:8,padding:"10px 16px",background:"#f9f9f9",fontSize:12,fontWeight:600,color:"#888"}}>
                  <span>Producto</span><span style={{textAlign:"right"}}>Uds</span><span style={{textAlign:"right"}}>Kg</span><span style={{textAlign:"right"}}>Importe</span>
                </div>
                {totalesProd.map((pr,i)=>(
                  <div key={i} style={{display:"grid",gridTemplateColumns:"1fr auto auto auto",gap:8,padding:"10px 16px",borderTop:"1px solid #f2f2f2"}}>
                    <span style={{fontSize:13.5,color:"#222"}}>{pr.nombre}</span>
                    <span style={{fontSize:13,fontWeight:600,color:COLOR,textAlign:"right"}}>{pr.bandejas}</span>
                    <span style={{fontSize:13,color:"#888",textAlign:"right",minWidth:55}}>{pr.kg>0?`≈${pr.kg.toFixed(2)}`:"—"}</span>
                    <span style={{fontSize:13,fontWeight:600,color:"#333",textAlign:"right",minWidth:70}}>{pr.importe>0?eur(pr.importe):"—"}</span>
                  </div>
                ))}
                <div style={{display:"grid",gridTemplateColumns:"1fr auto auto auto",gap:8,padding:"12px 16px",borderTop:"2px solid #eee",background:"#f9f9f9"}}>
                  <span style={{fontSize:13,fontWeight:700,color:"#333"}}>TOTAL</span>
                  <span style={{fontSize:13,fontWeight:700,color:COLOR,textAlign:"right"}}>{totalesProd.reduce((a,p)=>a+p.bandejas,0)}</span>
                  <span style={{fontSize:13,fontWeight:700,color:"#555",textAlign:"right"}}>≈{totalesProd.reduce((a,p)=>a+p.kg,0).toFixed(2)}</span>
                  <span style={{fontSize:13,fontWeight:700,color:COLOR,textAlign:"right"}}>{eur(totalesProd.reduce((a,p)=>a+p.importe,0))}</span>
                </div>
              </div>
            )}

            {!cargando&&tabP==="pedidos"&&filtrados.map(p=>(
              <div key={p.id} style={{background:"#fff",border:"1px solid #eee",borderRadius:14,padding:"14px 16px",marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <div style={{fontWeight:600,fontSize:14,color:"#222"}}>{p.nombre}</div>
                    <div style={{fontSize:12,color:"#888",marginTop:2}}>{p.telefono}{p.email?` · ${p.email}`:""} · {p.fecha}</div>
                    {p.entrega_elegida&&<div style={{fontSize:12,color:COLOR,fontWeight:600,marginTop:3}}>📦 Entrega: {p.entrega_elegida}</div>}
                  </div>
                  <span style={{display:"inline-block",padding:"3px 12px",borderRadius:20,fontSize:11,fontWeight:600,background:p.estado==="listo"?"#eafaf1":p.estado==="preparando"?"#fff8e1":COLOR_LIGHT,color:p.estado==="listo"?"#1a7a3c":p.estado==="preparando"?"#b8860b":COLOR}}>{p.estado}</span>
                </div>
                <div style={{fontSize:13,color:"#555",marginTop:8}}>
                  {(p.productos||[]).map((pr,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                      <span>• {pr.nombre}{pr.opcion?` · ${pr.opcion}`:""} — {pr.bandejas} {pr.esLote?"lote(s)":"bandeja(s)"}{pr.kgTotal?` (≈${pr.kgTotal} kg)`:""}</span>
                      {pr.subtotal?<span style={{color:COLOR,fontWeight:600}}>{eur(pr.subtotal)}</span>:null}
                    </div>
                  ))}
                </div>
                {p.nota&&<div style={{fontSize:12,color:"#999",marginTop:4}}>Nota: {p.nota}</div>}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
                  <div style={{display:"flex",gap:6}}>
                    {["pendiente","preparando","listo"].map(e=>(
                      <button key={e} onClick={()=>cambiarEstado(p.id,e)} style={{padding:"4px 12px",borderRadius:20,border:`1.5px solid ${p.estado===e?COLOR:"#ddd"}`,background:p.estado===e?COLOR_LIGHT:"#fff",color:p.estado===e?COLOR:"#888",fontSize:12,cursor:"pointer",fontWeight:p.estado===e?600:400}}>{e}</button>
                    ))}
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{fontSize:14,fontWeight:700,color:COLOR}}>{eur(p.total)}</span>
                    <button onClick={()=>eliminarPedido(p.id)} style={{background:"none",border:"none",color:"#ccc",fontSize:16,cursor:"pointer"}}>🗑</button>
                  </div>
                </div>
              </div>
            ))}

            {tabP==="fechas"&&(
              <PanelFechas entregas={entregas} setEntregas={setEntregas}/>
            )}

            {tabP==="gestionar"&&(
              <div>
                {editando&&(
                  <div style={{background:"#fff",border:`1.5px solid ${COLOR}`,borderRadius:14,padding:"16px",marginBottom:16}}>
                    <div style={{fontSize:14,fontWeight:700,color:"#222",marginBottom:4}}>{editando.nuevo?"➕ Novo produto":"✏️ Editar produto"}</div>
                    <div style={{fontSize:12,color:"#888",marginBottom:12}}>Categoría: <strong>{cats.find(c=>c.id===editando.catId)?.nombre}</strong></div>
                    {CAMPOS.map(c=>(
                      <div key={c.key} style={{marginBottom:10}}>
                        <div style={{fontSize:12,color:"#555",marginBottom:3}}>{c.label}</div>
                        <input type={c.type} step="0.01" value={formProd[c.key]||""} onChange={e=>setFormProd(prev=>({...prev,[c.key]:e.target.value}))} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1.5px solid #ddd",fontSize:13,outline:"none",boxSizing:"border-box"}}/>
                      </div>
                    ))}
                    <div style={{display:"flex",gap:8,marginTop:8}}>
                      <button onClick={guardar} style={{flex:1,background:COLOR,color:"#fff",border:"none",borderRadius:10,padding:"11px",fontSize:14,fontWeight:600,cursor:"pointer"}}>Gardar</button>
                      <button onClick={()=>setEditando(null)} style={{flex:1,background:"#f5f5f5",color:"#555",border:"none",borderRadius:10,padding:"11px",fontSize:14,cursor:"pointer"}}>Cancelar</button>
                    </div>
                  </div>
                )}
                {cats.map(cat=>(
                  <div key={cat.id} style={{marginBottom:20}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                      <div style={{fontSize:14,fontWeight:700,color:cat.activa!==false?COLOR:"#aaa"}}>
                        {cat.emoji} {cat.nombre} {cat.activa===false&&<span style={{fontSize:11,fontWeight:400}}>(oculta)</span>}
                      </div>
                      <div style={{display:"flex",gap:6}}>
                        <button onClick={()=>toggleCategoria(cat.id)} style={{fontSize:12,background:cat.activa!==false?"#fff8e1":COLOR_LIGHT,color:cat.activa!==false?"#b8860b":COLOR,border:`1px solid ${cat.activa!==false?"#FFE082":COLOR}`,borderRadius:8,padding:"4px 12px",cursor:"pointer"}}>
                          {cat.activa!==false?"🙈 Ocultar":"👁 Mostrar"}
                        </button>
                        <button onClick={()=>abrirNuevo(cat.id)} style={{fontSize:12,background:COLOR,color:"#fff",border:"none",borderRadius:8,padding:"5px 14px",cursor:"pointer"}}>+ Engadir</button>
                      </div>
                    </div>
                    {cat.productos.map(prod=>(
                      <div key={prod.id} style={{background:"#fff",border:"1px solid #eee",borderRadius:10,padding:"10px 14px",marginBottom:6,display:"flex",alignItems:"center",gap:8,opacity:cat.activa===false?0.5:1}}>
                        <div style={{flex:1}}>
                          <div style={{fontSize:13,fontWeight:500,color:"#222"}}>{prod.nombre}</div>
                          <div style={{fontSize:11,color:"#888"}}>{prod.bandeja?`${prod.bandeja} kg · `:""}{eur(prod.pBandeja)}/bandeja · {eur(prod.pKilo)}/kg{prod.nota?` · ${prod.nota}`:""}</div>
                        </div>
                        <button onClick={()=>abrirEditar(cat.id,prod)} style={{background:"none",border:`1px solid ${COLOR}`,color:COLOR,borderRadius:8,padding:"4px 10px",fontSize:12,cursor:"pointer"}}>✏️</button>
                        <button onClick={()=>eliminarProd(cat.id,prod.id)} style={{background:"none",border:"1px solid #e8b5b2",color:"#c0392b",borderRadius:8,padding:"4px 10px",fontSize:12,cursor:"pointer"}}>🗑</button>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    function App(){
      const [cats,setCatsState]=useState(CATEGORIAS_INIT);
      const [catsId,setCatsId]=useState(null);
      const [bandejas,setBandejas]=useState({});
      const [opcionesLote,setOpcionesLote]=useState({});
      const [catActiva,setCatActiva]=useState("todas");
      const [modal,setModal]=useState(false);
      const [enviado,setEnviado]=useState(false);
      const [form,setForm]=useState({nombre:"",telefono:"",email:"",nota:""});
      const [entregaElegida,setEntregaElegida]=useState("");
      const [panel,setPanel]=useState(false);
      const [panelPass,setPanelPass]=useState(false);
      const [passInput,setPassInput]=useState("");
      const [passError,setPassError]=useState(false);
      const [entregas,setEntregas]=useState([]);

      useEffect(()=>{
        window.db.from("categorias").select("*").limit(1).then(({data})=>{
          if(data&&data.length>0){setCatsState(data[0].data);setCatsId(data[0].id);}
        });
        window.db.from("config").select("*").then(({data})=>{
          if(data) data.forEach(r=>{
            if(r.clave==="entregas_multiples"){
              try{setEntregas(JSON.parse(r.valor)||[]);}catch(e){}
            }
            if(r.clave==="fecha_entrega"&&r.valor){
              setEntregas(prev=>{
                if(prev.length>0) return prev;
                return [{fechaEntrega:r.valor,fechaLimite:"",fechaLimiteISO:""}];
              });
            }
          });
        });
      },[]);

      const setCats=async(nc)=>{
        setCatsState(nc);
        if(catsId){await window.db.from("categorias").update({data:nc}).eq("id",catsId);}
        else{const{data}=await window.db.from("categorias").insert([{data:nc}]).select();if(data?.[0])setCatsId(data[0].id);}
      };

      const abrirModal=()=>{
        const ahora=new Date();
        const vigentes=entregas.filter(e=>!e.fechaLimiteISO||new Date(e.fechaLimiteISO+"T23:59:59")>=ahora);
        if(vigentes.length===1) setEntregaElegida(vigentes[0].fechaEntrega);
        else setEntregaElegida("");
        setModal(true);setEnviado(false);
      };

      const catsActivas=cats.filter(c=>c.activa!==false);
      const allProds=cats.flatMap(c=>c.productos);
      const seleccionados=allProds.filter(p=>(bandejas[p.id]||0)>0);
      const totalPedido=useMemo(()=>seleccionados.reduce((acc,p)=>acc+(bandejas[p.id]||0)*p.pBandeja,0),[seleccionados,bandejas]);
      const catsOrdenadas=catsActivas.map(c=>({...c,productos:[...c.productos].sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"))}));
      const catsFiltradas=catActiva==="todas"?catsOrdenadas:catsOrdenadas.filter(c=>c.id===catActiva);
      const setCant=(id,val)=>setBandejas(prev=>({...prev,[id]:Math.max(0,Math.round(parseFloat(val)||0))}));

      const ahora=new Date();
      const entregasVigentes=entregas.filter(e=>!e.fechaLimiteISO||new Date(e.fechaLimiteISO+"T23:59:59")>=ahora);
      const requiereEntrega=entregasVigentes.length>1;
      const puedeEnviar=form.nombre&&form.telefono&&form.email&&(!requiereEntrega||entregaElegida);

      const enviar=async()=>{
        if(!puedeEnviar) return;
        const nuevo={
          nombre:form.nombre,telefono:form.telefono,email:form.email,nota:form.nota,
          fecha:new Date().toLocaleString("es-ES"),iso_date:new Date().toISOString().slice(0,10),
          estado:"pendiente",total:totalPedido,
          entrega_elegida:entregaElegida||null,
          productos:seleccionados.map(p=>({
            nombre:p.nombre,bandejas:bandejas[p.id],esLote:!!p.opciones,
            kgTotal:p.bandeja?+(bandejas[p.id]*p.bandeja).toFixed(2):null,
            subtotal:+(bandejas[p.id]*p.pBandeja).toFixed(2),
            opcion:opcionesLote[p.id]?Object.values(opcionesLote[p.id]).join(" + "):null
          }))
        };
        await window.db.from("pedidos").insert([nuevo]);
        sendEmail({...nuevo,entregaElegida:nuevo.entrega_elegida});
        setEnviado(true);
      };

      const entrarPanel=()=>{
        if(passInput===PASS){setPanel(true);setPassError(false);setPanelPass(false);setPassInput("");}
        else setPassError(true);
      };

      if(panel) return <Panel cats={cats} setCats={setCats} entregas={entregas} setEntregas={setEntregas} onBack={()=>setPanel(false)}/>;

      const C=COLOR;
      return(
        <div style={{fontFamily:"system-ui,sans-serif",maxWidth:780,margin:"0 auto",paddingBottom:80}}>
          <div style={{background:C,padding:"22px 20px 18px",borderRadius:"0 0 16px 16px"}}>
            <div style={{color:"#fff",fontSize:22,fontWeight:600}}>🌿 Carnes Ecológicas Mundo Verde</div>
            <div style={{color:"rgba(255,255,255,0.82)",fontSize:13,marginTop:4}}>Reserva de carnes frescas de producción ecológica · Pontevedra</div>
            <span style={{display:"inline-block",background:"rgba(255,255,255,0.18)",color:"#fff",fontSize:11,padding:"2px 10px",borderRadius:20,marginTop:10}}>Producción 100% ecológica</span>
          </div>

          <div style={{display:"flex",justifyContent:"flex-end",padding:"10px 16px 0"}}>
            <span onClick={()=>setPanelPass(v=>!v)} style={{fontSize:12,color:"#aaa",cursor:"pointer",textDecoration:"underline"}}>Acceso panel</span>
          </div>

          {panelPass&&(
            <div style={{margin:"8px 16px",background:"#fff",border:"1px solid #eee",borderRadius:12,padding:"14px 16px"}}>
              <div style={{fontSize:13,fontWeight:600,marginBottom:8,color:"#333"}}>Contraseña del panel</div>
              <div style={{display:"flex",gap:8}}>
                <input type="password" value={passInput} onChange={e=>setPassInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&entrarPanel()} placeholder="Contraseña" style={{flex:1,padding:"10px 14px",borderRadius:10,border:"1.5px solid #ddd",fontSize:14,outline:"none"}}/>
                <button onClick={entrarPanel} style={{background:C,color:"#fff",border:"none",borderRadius:10,padding:"0 16px",cursor:"pointer",fontSize:14}}>Entrar</button>
              </div>
              {passError&&<div style={{fontSize:12,color:"#c0392b",marginTop:6}}>Contraseña incorrecta</div>}
            </div>
          )}

          <div style={{margin:"12px 16px 0"}}><Aviso/></div>
          {entregasVigentes.length>0&&<div style={{margin:"10px 16px 0"}}><BannerFechas entregas={entregas}/></div>}

          <div style={{display:"flex",gap:8,overflowX:"auto",padding:"14px 16px 4px",scrollbarWidth:"none"}}>
            {[{id:"todas",nombre:"Todas",emoji:""},...catsActivas].map(c=>(
              <button key={c.id} onClick={()=>setCatActiva(c.id)} style={{flexShrink:0,padding:"6px 14px",borderRadius:20,border:`1.5px solid ${catActiva===c.id?C:"#ddd"}`,background:catActiva===c.id?C:"#fff",color:catActiva===c.id?"#fff":"#555",fontSize:13,cursor:"pointer",fontWeight:catActiva===c.id?600:400}}>
                {c.emoji?`${c.emoji} `:""}{c.nombre}
              </button>
            ))}
          </div>

          {catsFiltradas.map(cat=>(
            <div key={cat.id} style={{margin:"18px 16px 0"}}>
              <div style={{fontSize:15,fontWeight:600,color:C,marginBottom:10}}>{cat.emoji} {cat.nombre} · producción ecológica</div>
              {cat.productos.map(prod=>(
                <ProductCard key={prod.id} prod={prod} qty={bandejas[prod.id]||0} setCant={setCant} opcionesLote={opcionesLote} setOpcionesLote={setOpcionesLote}/>
              ))}
            </div>
          ))}

          {seleccionados.length>0&&(
            <button onClick={abrirModal} style={{position:"fixed",bottom:16,left:"50%",transform:"translateX(-50%)",background:C,color:"#fff",border:"none",borderRadius:24,padding:"13px 28px",fontSize:15,fontWeight:600,cursor:"pointer",boxShadow:"0 4px 16px rgba(45,106,79,0.35)",zIndex:100,whiteSpace:"nowrap"}}>
              Ver reserva ({seleccionados.length} prod.) · {eur(totalPedido)} →
            </button>
          )}

          {modal&&(
            <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200}} onClick={e=>e.target===e.currentTarget&&setModal(false)}>
              <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 32px",width:"100%",maxWidth:780,maxHeight:"85vh",overflowY:"auto"}}>
                {!enviado?(
                  <>
                    <div style={{fontSize:17,fontWeight:700,color:"#222",marginBottom:16}}>A túa reserva</div>
                    {seleccionados.map(p=>{
                      const qty=bandejas[p.id],kg=p.bandeja?+(qty*p.bandeja).toFixed(2):null,sub=+(qty*p.pBandeja).toFixed(2),opcion=opcionesLote[p.id]?Object.values(opcionesLote[p.id]).join(" + "):null;
                      return(
                        <div key={p.id} style={{padding:"8px 0",borderBottom:"1px solid #f2f2f2"}}>
                          <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
                            <div style={{flex:1}}>
                              <div style={{color:"#333",fontSize:13.5}}>{p.nombre}</div>
                              <div style={{fontSize:11,color:"#888"}}>{qty} {p.opciones?"lote(s)":`bandeja${qty>1?"s":""}`}{kg?` · ≈${kg} kg`:""}</div>
                              {opcion&&<div style={{fontSize:11,color:C,fontWeight:600,marginTop:2}}>→ {opcion}</div>}
                            </div>
                            <span style={{color:C,fontWeight:600,flexShrink:0}}>{eur(sub)}</span>
                          </div>
                        </div>
                      );
                    })}
                    <div style={{display:"flex",justifyContent:"space-between",padding:"12px 0 4px",fontSize:15,fontWeight:700,borderTop:"2px solid #eee",marginTop:4}}>
                      <span style={{color:"#333"}}>Total orientativo</span>
                      <span style={{color:C}}>{eur(totalPedido)}</span>
                    </div>
                    <div style={{margin:"12px 0 8px"}}><Aviso/></div>

                    {entregasVigentes.length>0&&(
                      <div style={{marginBottom:4,marginTop:8}}>
                        <SelectorEntrega entregas={entregas} entregaElegida={entregaElegida} setEntregaElegida={setEntregaElegida}/>
                        {requiereEntrega&&!entregaElegida&&<div style={{fontSize:12,color:"#c0392b",marginTop:-8,marginBottom:8}}>* Debes escoller unha data de entrega</div>}
                      </div>
                    )}

                    <div style={{marginBottom:6,fontSize:14,fontWeight:600,color:"#333"}}>Os teus datos</div>
                    {["nombre","telefono","email","nota"].map(f=>(
                      <input key={f} style={{width:"100%",padding:"11px 14px",borderRadius:10,border:"1.5px solid #ddd",fontSize:14,marginBottom:12,boxSizing:"border-box",outline:"none"}}
                        placeholder={f==="nombre"?"Nome *":f==="telefono"?"Teléfono *":f==="email"?"Email *":"Nota ou indicación (opcional)"}
                        value={form[f]} onChange={e=>setForm(prev=>({...prev,[f]:e.target.value}))}/>
                    ))}
                    <button onClick={enviar} disabled={!puedeEnviar} style={{width:"100%",background:puedeEnviar?C:"#ccc",color:"#fff",border:"none",borderRadius:12,padding:"14px",fontSize:15,fontWeight:700,cursor:puedeEnviar?"pointer":"not-allowed"}}>Confirmar reserva</button>
                    <button onClick={()=>setModal(false)} style={{width:"100%",background:"#f5f5f5",color:"#555",border:"none",borderRadius:12,padding:"12px",fontSize:14,cursor:"pointer",marginTop:8}}>Seguir escollendo</button>
                  </>
                ):(
                  <div style={{textAlign:"center",padding:"20px 10px"}}>
                    <div style={{fontSize:48,marginBottom:12}}>✅</div>
                    <div style={{fontSize:20,fontWeight:700,color:C,marginBottom:8}}>Reserva confirmada!</div>
                    {entregaElegida&&<div style={{fontSize:14,color:C,fontWeight:600,marginBottom:8}}>📦 Entrega: {entregaElegida}</div>}
                    <div style={{fontSize:14,color:"#666"}}>Xa recibimos o teu pedido, {form.nombre}. Enviámosche un email de confirmación. En breve poñerémonos en contacto contigo para coordinar a recollida.</div>
                    <button onClick={()=>{setModal(false);setBandejas({});setOpcionesLote({});setForm({nombre:"",telefono:"",email:"",nota:""});setEntregaElegida("");}} style={{width:"100%",background:C,color:"#fff",border:"none",borderRadius:12,padding:"14px",fontSize:15,fontWeight:700,cursor:"pointer",marginTop:20}}>Nova reserva</button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App/>, document.getElementById("root"));
  </script>
</body>
</html>
