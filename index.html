                </div>
                {totalesProd.map((pr, i) => (
                  <div key={i} style={{ display:"grid", gridTemplateColumns:"1fr auto auto auto", gap:8, padding:"10px 16px", borderTop:"1px solid #f2f2f2" }}>
                    <span style={{ fontSize:13.5, color:"#222" }}>{pr.nombre}</span>
                    <span style={{ fontSize:13, fontWeight:600, color:COLOR, textAlign:"right" }}>{pr.bandejas}</span>
                    <span style={{ fontSize:13, color:"#888", textAlign:"right", minWidth:55 }}>{pr.kg>0?`≈${pr.kg.toFixed(2)}`:"—"}</span>
                    <span style={{ fontSize:13, fontWeight:600, color:"#333", textAlign:"right", minWidth:70 }}>{pr.importe>0?eur(pr.importe):"—"}</span>
                  </div>
                ))}
                <div style={{ display:"grid", gridTemplateColumns:"1fr auto auto auto", gap:8, padding:"12px 16px", borderTop:"2px solid #eee", background:"#f9f9f9" }}>
                  <span style={{ fontSize:13, fontWeight:700, color:"#333" }}>TOTAL</span>
                  <span style={{ fontSize:13, fontWeight:700, color:COLOR, textAlign:"right" }}>{totalesProd.reduce((a,p)=>a+p.bandejas,0)}</span>
                  <span style={{ fontSize:13, fontWeight:700, color:"#555", textAlign:"right" }}>≈{totalesProd.reduce((a,p)=>a+p.kg,0).toFixed(2)}</span>
                  <span style={{ fontSize:13, fontWeight:700, color:COLOR, textAlign:"right" }}>{eur(totalesProd.reduce((a,p)=>a+p.importe,0))}</span>
                </div>
              </div>
            )}
            {tab === "pedidos" && filtrados.map(p => (
              <div key={p.id} style={{ background:"#fff", border:"1px solid #eee", borderRadius:14, padding:"14px 16px", marginBottom:10 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
                  <div>
                    <div style={{ fontWeight:600, fontSize:14, color:"#222" }}>{p.nombre}</div>
                    <div style={{ fontSize:12, color:"#888", marginTop:2 }}>{p.telefono}{p.email?` · ${p.email}`:""} · {p.fecha}</div>
                  </div>
                  <span style={{ display:"inline-block", padding:"3px 12px", borderRadius:20, fontSize:11, fontWeight:600, background:p.estado==="listo"?"#eafaf1":p.estado==="preparando"?"#fff8e1":COLOR_LIGHT, color:p.estado==="listo"?"#1a7a3c":p.estado==="preparando"?"#b8860b":COLOR }}>{p.estado}</span>
                </div>
                <div style={{ fontSize:13, color:"#555", marginTop:8 }}>
                  {p.productos.map((pr, i) => (
                    <div key={i} style={{ display:"flex", justifyContent:"space-between" }}>
                      <span>• {pr.nombre} — {pr.bandejas} bandeja{pr.bandejas>1?"s":""}{pr.kgTotal?` (≈${pr.kgTotal} kg)`:""}</span>
                      {pr.subtotal ? <span style={{ color:COLOR, fontWeight:600 }}>{eur(pr.subtotal)}</span> : null}
                    </div>
                  ))}
                </div>
                {p.nota && <div style={{ fontSize:12, color:"#999", marginTop:4 }}>Nota: {p.nota}</div>}
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:10 }}>
                  <div style={{ display:"flex", gap:6 }}>
                    {["pendiente","preparando","listo"].map(e => (
                      <button key={e} onClick={() => cambiarEstado(p.id,e)} style={{ padding:"4px 12px", borderRadius:20, border:`1.5px solid ${p.estado===e?COLOR:"#ddd"}`, background:p.estado===e?COLOR_LIGHT:"#fff", color:p.estado===e?COLOR:"#888", fontSize:12, cursor:"pointer", fontWeight:p.estado===e?600:400 }}>{e}</button>
                    ))}
                  </div>
                  <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                    <span style={{ fontSize:14, fontWeight:700, color:COLOR }}>{eur(p.total)}</span>
                    <button onClick={() => eliminarPedido(p.id)} style={{ background:"none", border:"none", color:"#ccc", fontSize:16, cursor:"pointer", padding:"0 4px" }} title="Eliminar pedido">🗑</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function App() {
      const [bandejas, setBandejas] = useState({});
      const [catActiva, setCatActiva] = useState("todas");
      const [modal, setModal] = useState(false);
      const [enviado, setEnviado] = useState(false);
      const [form, setForm] = useState({ nombre:"", telefono:"", email:"", nota:"" });
      const [pedidos, setPedidos] = useState([]);
      const [panel, setPanel] = useState(false);
      const [panelPass, setPanelPass] = useState(false);
      const [passInput, setPassInput] = useState("");
      const [passError, setPassError] = useState(false);

      const allProds = CATEGORIAS.flatMap(c => c.productos);
      const seleccionados = allProds.filter(p => (bandejas[p.id]||0) > 0);
      const totalPedido = useMemo(() => seleccionados.reduce((acc,p) => acc+(bandejas[p.id]||0)*p.pBandeja, 0), [seleccionados, bandejas]);
      const cats = catActiva === "todas" ? CATEGORIAS : CATEGORIAS.filter(c => c.id === catActiva);
      const setCant = (id, val) => setBandejas(prev => ({ ...prev, [id]: Math.max(0, Math.round(parseFloat(val)||0)) }));

      const enviar = () => {
        if (!form.nombre || !form.telefono) return;
        const nuevo = {
          id: Date.now(), nombre:form.nombre, telefono:form.telefono, email:form.email, nota:form.nota,
          fecha: new Date().toLocaleString("es-ES"), isoDate: new Date().toISOString().slice(0,10),
          estado: "pendiente", total: totalPedido,
          productos: seleccionados.map(p => ({
            nombre:p.nombre, bandejas:bandejas[p.id],
            kgTotal: p.bandeja ? +(bandejas[p.id]*p.bandeja).toFixed(2) : null,
            subtotal: +(bandejas[p.id]*p.pBandeja).toFixed(2)
          }))
        };
        setPedidos(prev => [nuevo, ...prev]);
        sendEmail(nuevo);
        setEnviado(true);
      };

      const entrarPanel = () => {
        if (passInput === PASS) { setPanel(true); setPassError(false); setPanelPass(false); setPassInput(""); }
        else setPassError(true);
      };

      if (panel) return <Panel pedidos={pedidos} setPedidos={setPedidos} onBack={() => setPanel(false)} />;

      const C = COLOR;
      return (
        <div style={{ fontFamily:"system-ui,sans-serif", maxWidth:780, margin:"0 auto", paddingBottom:80 }}>
          <div style={{ background:C, padding:"22px 20px 18px", borderRadius:"0 0 16px 16px" }}>
            <div style={{ color:"#fff", fontSize:22, fontWeight:600 }}>🌿 Carnes Ecológicas Mundo Verde</div>
            <div style={{ color:"rgba(255,255,255,0.82)", fontSize:13, marginTop:4 }}>Reserva de carnes frescas de producción ecológica · Pontevedra</div>
            <span style={{ display:"inline-block", background:"rgba(255,255,255,0.18)", color:"#fff", fontSize:11, padding:"2px 10px", borderRadius:20, marginTop:10 }}>Producción 100% ecológica</span>
          </div>

          <div style={{ display:"flex", justifyContent:"flex-end", padding:"10px 16px 0" }}>
            <span onClick={() => setPanelPass(v=>!v)} style={{ fontSize:12, color:"#aaa", cursor:"pointer", textDecoration:"underline" }}>Acceso panel</span>
          </div>

          {panelPass && (
            <div style={{ margin:"8px 16px", background:"#fff", border:"1px solid #eee", borderRadius:12, padding:"14px 16px" }}>
              <div style={{ fontSize:13, fontWeight:600, marginBottom:8, color:"#333" }}>Contraseña del panel</div>
              <div style={{ display:"flex", gap:8 }}>
                <input type="password" value={passInput} onChange={e=>setPassInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&entrarPanel()} placeholder="Contraseña" style={{ flex:1, padding:"10px 14px", borderRadius:10, border:"1.5px solid #ddd", fontSize:14, outline:"none" }} />
                <button onClick={entrarPanel} style={{ background:C, color:"#fff", border:"none", borderRadius:10, padding:"0 16px", cursor:"pointer", fontSize:14 }}>Entrar</button>
              </div>
              {passError && <div style={{ fontSize:12, color:"#c0392b", marginTop:6 }}>Contraseña incorrecta</div>}
            </div>
          )}

          <div style={{ margin:"12px 16px 0" }}><Aviso /></div>

          <div style={{ display:"flex", gap:8, overflowX:"auto", padding:"14px 16px 4px", scrollbarWidth:"none" }}>
            {[{ id:"todas", nombre:"Todas", emoji:"" }, ...CATEGORIAS].map(c => (
              <button key={c.id} onClick={() => setCatActiva(c.id)} style={{ flexShrink:0, padding:"6px 14px", borderRadius:20, border:`1.5px solid ${catActiva===c.id?C:"#ddd"}`, background:catActiva===c.id?C:"#fff", color:catActiva===c.id?"#fff":"#555", fontSize:13, cursor:"pointer", fontWeight:catActiva===c.id?600:400 }}>
                {c.emoji?`${c.emoji} `:""}{c.nombre}
              </button>
            ))}
          </div>

          {cats.map(cat => (
            <div key={cat.id} style={{ margin:"18px 16px 0" }}>
              <div style={{ fontSize:15, fontWeight:600, color:C, marginBottom:10 }}>{cat.emoji} {cat.nombre} · producción ecológica</div>
              {cat.productos.map(prod => {
                const qty = bandejas[prod.id]||0;
                const kg = prod.bandeja ? +(qty*prod.bandeja).toFixed(2) : null;
                const sub = +(qty*prod.pBandeja).toFixed(2);
                return (
                  <div key={prod.id} style={{ background:"#fff", border:qty>0?`1.5px solid ${C}`:"1px solid #eee", borderRadius:12, padding:"11px 14px", marginBottom:8, display:"flex", alignItems:"center", gap:10 }}>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:13.5, color:"#222", fontWeight:500 }}>{prod.nombre}</div>
                      <div style={{ fontSize:11, color:"#888", marginTop:2 }}>
                        {prod.bandeja ? <span>Bandeja ≈ {prod.bandeja} kg · </span> : null}
                        <span>{eur(prod.pBandeja)}/bandeja</span>
                        <span style={{ margin:"0 6px", color:"#ddd" }}>|</span>
                        <span>{eur(prod.pKilo)}/kg</span>
                        {prod.nota ? <span> · {prod.nota}</span> : null}
                      </div>
                      {qty > 0 && (
                        <div style={{ fontSize:11, marginTop:3 }}>
                          {kg ? <span style={{ color:"#888" }}>≈ {kg} kg · </span> : null}
                          <span style={{ color:C, fontWeight:700 }}>{eur(sub)}</span>
                        </div>
                      )}
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                      <button onClick={() => setCant(prod.id,qty-1)} style={{ width:28, height:28, borderRadius:8, border:`1.5px solid ${C}`, background:"#fff", color:C, fontSize:16, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:700 }}>−</button>
                      <div style={{ textAlign:"center" }}>
                        <div style={{ fontSize:14, fontWeight:600, minWidth:22, textAlign:"center", color:"#222" }}>{qty}</div>
                        <div style={{ fontSize:10, color:"#aaa", lineHeight:1 }}>bandeja{qty!==1?"s":""}</div>
                      </div>
                      <button onClick={() => setCant(prod.id,qty+1)} style={{ width:28, height:28, borderRadius:8, border:`1.5px solid ${C}`, background:"#fff", color:C, fontSize:16, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:700 }}>+</button>
                    </div>
                  </div>
                );
              })}
            </div>
          ))}

          {seleccionados.length > 0 && (
            <button onClick={() => { setModal(true); setEnviado(false); }} style={{ position:"fixed", bottom:16, left:"50%", transform:"translateX(-50%)", background:C, color:"#fff", border:"none", borderRadius:24, padding:"13px 28px", fontSize:15, fontWeight:600, cursor:"pointer", boxShadow:"0 4px 16px rgba(45,106,79,0.35)", zIndex:100, whiteSpace:"nowrap" }}>
              Ver reserva ({seleccionados.length} prod.) · {eur(totalPedido)} →
            </button>
          )}

          {modal && (
            <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.45)", display:"flex", alignItems:"flex-end", justifyContent:"center", zIndex:200 }} onClick={e=>e.target===e.currentTarget&&setModal(false)}>
              <div style={{ background:"#fff", borderRadius:"20px 20px 0 0", padding:"24px 20px 32px", width:"100%", maxWidth:780, maxHeight:"85vh", overflowY:"auto" }}>
                {!enviado ? (
                  <>
                    <div style={{ fontSize:17, fontWeight:700, color:"#222", marginBottom:16 }}>Tu reserva</div>
                    {seleccionados.map(p => {
                      const qty = bandejas[p.id];
                      const kg = p.bandeja ? +(qty*p.bandeja).toFixed(2) : null;
                      const sub = +(qty*p.pBandeja).toFixed(2);
                      return (
                        <div key={p.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", padding:"8px 0", borderBottom:"1px solid #f2f2f2", fontSize:13.5, gap:8 }}>
                          <div style={{ flex:1 }}>
                            <div style={{ color:"#333" }}>{p.nombre}</div>
                            <div style={{ fontSize:11, color:"#888" }}>{qty} bandeja{qty>1?"s":""}{kg?` · ≈${kg} kg`:""}</div>
                          </div>
                          <span style={{ color:C, fontWeight:600, flexShrink:0 }}>{eur(sub)}</span>
                        </div>
                      );
                    })}
                    <div style={{ display:"flex", justifyContent:"space-between", padding:"12px 0 4px", fontSize:15, fontWeight:700, borderTop:"2px solid #eee", marginTop:4 }}>
                      <span style={{ color:"#333" }}>Total orientativo</span>
                      <span style={{ color:C }}>{eur(totalPedido)}</span>
                    </div>
                    <div style={{ margin:"12px 0 16px" }}><Aviso /></div>
                    <div style={{ marginBottom:6, fontSize:14, fontWeight:600, color:"#333" }}>Tus datos</div>
                    {["nombre","telefono","email","nota"].map(f => (
                      <input key={f} style={{ width:"100%", padding:"11px 14px", borderRadius:10, border:"1.5px solid #ddd", fontSize:14, marginBottom:12, boxSizing:"border-box", outline:"none" }}
                        placeholder={f==="nombre"?"Nombre *":f==="telefono"?"Teléfono *":f==="email"?"Email (opcional)":"Nota o indicación (opcional)"}
                        value={form[f]} onChange={e=>setForm(prev=>({...prev,[f]:e.target.value}))} />
                    ))}
                    <button onClick={enviar} disabled={!form.nombre||!form.telefono} style={{ width:"100%", background:form.nombre&&form.telefono?C:"#ccc", color:"#fff", border:"none", borderRadius:12, padding:"14px", fontSize:15, fontWeight:700, cursor:form.nombre&&form.telefono?"pointer":"not-allowed" }}>Confirmar reserva</button>
                    <button onClick={()=>setModal(false)} style={{ width:"100%", background:"#f5f5f5", color:"#555", border:"none", borderRadius:12, padding:"12px", fontSize:14, cursor:"pointer", marginTop:8 }}>Seguir eligiendo</button>
                  </>
                ) : (
                  <div style={{ textAlign:"center", padding:"20px 10px" }}>
                    <div style={{ fontSize:48, marginBottom:12 }}>✅</div>
                    <div style={{ fontSize:20, fontWeight:700, color:C, marginBottom:8 }}>¡Reserva confirmada!</div>
                    <div style={{ fontSize:14, color:"#666" }}>Hemos recibido tu pedido{form.nombre?`, ${form.nombre}`:""}. En breve nos pondremos en contacto contigo para coordinar la recogida.{form.email?" Te hemos enviado un email de confirmación.":""}</div>
                    <button onClick={()=>{setModal(false);setBandejas({});setForm({nombre:"",telefono:"",email:"",nota:""});}} style={{ width:"100%", background:C, color:"#fff", border:"none", borderRadius:12, padding:"14px", fontSize:15, fontWeight:700, cursor:"pointer", marginTop:20 }}>Nueva reserva</button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
